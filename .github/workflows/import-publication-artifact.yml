name: Import publication artifact

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo that produced the publication artifact"
        required: true
        default: "scott-love/academic-cv"
      source_branch:
        description: "Source branch to search successful workflow runs"
        required: true
        default: "main"
      source_ref:
        description: "Source branch/tag/SHA metadata (for PR text later)"
        required: true
        default: "main"

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  import-publication-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Show run inputs
        run: |
          echo "source_repo=${{ inputs.source_repo }}"
          echo "source_branch=${{ inputs.source_branch }}"
          echo "source_ref=${{ inputs.source_ref }}"
          echo "website_repo=${{ github.repository }}"
          echo "website_ref=${{ github.ref_name }}"

      - name: Find latest successful source run with artifacts
        id: source_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID="$(
            gh api "/repos/${{ inputs.source_repo }}/actions/runs?branch=${{ inputs.source_branch }}&status=success&per_page=20" \
              --jq '
                .workflow_runs[]
                | select(.artifacts_url != null)
                | .id
              ' \
              | while read -r id; do
                  count="$(gh api "/repos/${{ inputs.source_repo }}/actions/runs/${id}/artifacts" --jq ".total_count")"
                  if [ "${count}" -gt 0 ]; then
                    echo "${id}"
                    break
                  fi
                done
          )"

          if [ -z "${RUN_ID:-}" ]; then
            echo "No successful run with artifacts found in ${{ inputs.source_repo }} on branch ${{ inputs.source_branch }}"
            exit 1
          fi

          echo "Found source RUN_ID=${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: List artifacts in source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${{ inputs.source_repo }}/actions/runs/${{ steps.source_run.outputs.run_id }}/artifacts" \
            --jq '.artifacts[] | "\(.name) (expired=\(.expired), size=\(.size_in_bytes))"'

      - name: Download publication artifact and show files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp/artifact

          gh run download "${{ steps.source_run.outputs.run_id }}" \
            --repo "${{ inputs.source_repo }}" \
            --name "website-publications-${{ steps.source_run.outputs.run_id }}" \
            --dir tmp/artifact

          echo "Downloaded artifact files:"
          find tmp/artifact -type f | sort

      - name: Sync publication content from artifact (safe)
        run: |
          set -euo pipefail
          SRC="tmp/artifact/build/hugo/content/en/publication/"
          DST="content/en/publication/"

          test -d "$SRC"
          mkdir -p "$DST"

          rsync -av --delete \
            --exclude "_index.md" \
            --exclude ".Rhistory" \
            --exclude "*/featured.png" \
            "$SRC" "$DST"

          rm -rf tmp

      - name: Re-apply website editorial overrides
        run: |
          set -euo pipefail
          python3 scripts/apply_publication_overrides.py

      - name: Git status after import + overrides
        run: |
          set -euo pipefail
          git status --short
          echo "Changed files count:"
          git diff --name-only | wc -l

      - name: Commit and push import branch (if changes)
        id: commit_push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No publication changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SOURCE_RUN_ID="${{ steps.source_run.outputs.run_id }}"
          IMPORT_BRANCH="bot/import-publications-${SOURCE_RUN_ID}-ghrun-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${IMPORT_BRANCH}"
          git add content/en/publication
          git commit -m "chore(publications): import from ${{ inputs.source_repo }} run ${SOURCE_RUN_ID}"
          git push -u origin "${IMPORT_BRANCH}"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "import_branch=${IMPORT_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open PR to master
        if: steps.commit_push.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SOURCE_RUN_ID="${{ steps.source_run.outputs.run_id }}"
          IMPORT_BRANCH="${{ steps.commit_push.outputs.import_branch }}"
          REMOVAL_THRESHOLD=0

          NEW_COUNT="$(find content/en/publication -mindepth 2 -maxdepth 2 -name index.md | wc -l | tr -d ' ')"
          BASELINE_FILE="$(mktemp)"
          git ls-tree -r --name-only origin/master content/en/publication \
            | sed -n 's#^content/en/publication/\([^/][^/]*/\)/index.md$#\1#p' \
            | sed 's#/$##' \
            | sort > "${BASELINE_FILE}"
          CURRENT_FILE="$(mktemp)"
          find content/en/publication -mindepth 2 -maxdepth 2 -name index.md | sed 's#^content/en/publication/##' | sed 's#/index.md$##' | sort > "${CURRENT_FILE}"

          ADDED_FILE="$(mktemp)"
          REMOVED_FILE="$(mktemp)"
          comm -13 "${BASELINE_FILE}" "${CURRENT_FILE}" > "${ADDED_FILE}" || true
          comm -23 "${BASELINE_FILE}" "${CURRENT_FILE}" > "${REMOVED_FILE}" || true

          UPDATED_FILE="$(mktemp)"
          : > "${UPDATED_FILE}"
          while IFS= read -r id; do
            if [ -n "${id}" ] && [ -f "content/en/publication/${id}/index.md" ]; then
              if git cat-file -e "origin/master:content/en/publication/${id}/index.md" 2>/dev/null; then
                MASTER_TMP="$(mktemp)"
                git show "origin/master:content/en/publication/${id}/index.md" > "${MASTER_TMP}"
                if ! diff -q "${MASTER_TMP}" "content/en/publication/${id}/index.md" >/dev/null; then
                  echo "${id}" >> "${UPDATED_FILE}"
                fi
                rm -f "${MASTER_TMP}"
              fi
            fi
          done < "${CURRENT_FILE}"

          ADDED_COUNT="$(wc -l < "${ADDED_FILE}" | tr -d ' ')"
          UPDATED_COUNT="$(wc -l < "${UPDATED_FILE}" | tr -d ' ')"
          REMOVED_COUNT="$(wc -l < "${REMOVED_FILE}" | tr -d ' ')"
          TOTAL_DELTA="$((ADDED_COUNT + UPDATED_COUNT + REMOVED_COUNT))"  

          if [ "${REMOVED_COUNT}" -gt "${REMOVAL_THRESHOLD}" ]; then
            echo "ERROR: publication removals detected (${REMOVED_COUNT}) exceed threshold (${REMOVAL_THRESHOLD})." >&2
            echo "Removed HAL IDs:" >&2
            sed 's/^/- `&`/' "${REMOVED_FILE}" >&2
            exit 1
          fi

          PR_TITLE="chore(publications): import from ${{ inputs.source_repo }} run ${SOURCE_RUN_ID}"

          PR_BODY_FILE="$(mktemp)"
          {
            echo "Automated publication import from \`${{ inputs.source_repo }}\`."
            echo
            echo "- Source branch input: \`${{ inputs.source_branch }}\`"
            echo "- Source ref input: \`${{ inputs.source_ref }}\`"
            echo "- Source workflow run ID: \`${SOURCE_RUN_ID}\`"
            echo "- Imported publication count (index.md files): \`${NEW_COUNT}\`"
            echo
            echo "## Publication Diff Summary"
            echo "- Added HAL IDs: \`${ADDED_COUNT}\`"
            echo "- Updated HAL IDs: \`${UPDATED_COUNT}\`"
            echo "- Removed HAL IDs: \`${REMOVED_COUNT}\`"
            echo "- Removal threshold: \`${REMOVAL_THRESHOLD}\`"

            if [ "${ADDED_COUNT}" -gt 0 ]; then
              echo
              echo "<details><summary>Added HAL IDs</summary>"
              sed 's/^/- `&`/' "${ADDED_FILE}"
              echo "</details>"
            fi

            if [ "${UPDATED_COUNT}" -gt 0 ]; then
              echo
              echo "<details><summary>Updated HAL IDs</summary>"
              sed 's/^/- `&`/' "${UPDATED_FILE}"
              echo "</details>"
            fi

            if [ "${REMOVED_COUNT}" -gt 0 ]; then
              echo
              echo "<details><summary>Removed HAL IDs</summary>"
              sed 's/^/- `&`/' "${REMOVED_FILE}"
              echo "</details>"
            fi

            if [ "${REMOVED_COUNT}" -gt 0 ] || [ "${TOTAL_DELTA}" -gt 20 ]; then
              echo
              echo "## ⚠️ Warning"
              [ "${REMOVED_COUNT}" -gt 0 ] && echo "- Removals detected: \`${REMOVED_COUNT}\`"
              [ "${TOTAL_DELTA}" -gt 20 ] && echo "- Large change set detected: \`${TOTAL_DELTA}\` total HAL deltas"
              [ "${REMOVED_COUNT}" -gt "${REMOVAL_THRESHOLD}" ] && echo "- Workflow blocked by removal threshold"
            fi
            echo
            echo "This PR was generated by \`.github/workflows/import-publication-artifact.yml\`."
            echo
            echo "_No auto-merge is enabled; manual review required._"
          } > "${PR_BODY_FILE}"

          if gh pr list --head "${IMPORT_BRANCH}" --base master --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base master \
              --head "${IMPORT_BRANCH}" \
              --title "${PR_TITLE}" \
              --body-file "${PR_BODY_FILE}"
            echo "PR created."
          else
            echo "PR already exists for ${IMPORT_BRANCH}; skipping create."
          fi

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Publication Import Result"
            echo "- Source repo: \`${{ inputs.source_repo }}\`"
            echo "- Source branch: \`${{ inputs.source_branch }}\`"
            echo "- Source run ID: \`${{ steps.source_run.outputs.run_id }}\`"
            echo "- Changes detected: \`${{ steps.commit_push.outputs.has_changes }}\`"
            echo "- Import branch: \`${{ steps.commit_push.outputs.import_branch }}\`"
          } >> "$GITHUB_STEP_SUMMARY"