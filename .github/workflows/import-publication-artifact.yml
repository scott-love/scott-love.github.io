name: Import publication artifact

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo that produced the publication artifact"
        required: true
        default: "scott-love/academic-cv"
      source_branch:
        description: "Source branch to search successful workflow runs"
        required: true
        default: "main"
      source_ref:
        description: "Source branch/tag/SHA metadata (for PR text later)"
        required: true
        default: "main"

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  import-publication-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Show run inputs
        run: |
          echo "source_repo=${{ inputs.source_repo }}"
          echo "source_branch=${{ inputs.source_branch }}"
          echo "source_ref=${{ inputs.source_ref }}"
          echo "website_repo=${{ github.repository }}"
          echo "website_ref=${{ github.ref_name }}"

      - name: Find latest successful source run
        id: source_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --repo "${{ inputs.source_repo }}" \
            --branch "${{ inputs.source_branch }}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
            echo "No successful workflow run found in ${{ inputs.source_repo }} on branch ${{ inputs.source_branch }}"
            exit 1
          fi

          echo "Found source RUN_ID=${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: List artifacts in source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${{ inputs.source_repo }}/actions/runs/${{ steps.source_run.outputs.run_id }}/artifacts" \
            --jq '.artifacts[] | "\(.name) (expired=\(.expired), size=\(.size_in_bytes))"'

      - name: Download publication artifact and show files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp/artifact

          gh run download "${{ steps.source_run.outputs.run_id }}" \
            --repo "${{ inputs.source_repo }}" \
            --name "website-publications-${{ steps.source_run.outputs.run_id }}" \
            --dir tmp/artifact

          echo "Downloaded artifact files:"
          find tmp/artifact -type f | sort

      - name: Sync publication content from artifact (safe)
        run: |
          set -euo pipefail
          SRC="tmp/artifact/build/hugo/content/en/publication/"
          DST="content/en/publication/"

          test -d "$SRC"
          mkdir -p "$DST"

          rsync -av --delete \
            --exclude "_index.md" \
            --exclude ".Rhistory" \
            --exclude "*/featured.png" \
            "$SRC" "$DST"

          rm -rf tmp

          echo "Git status after safe sync:"
          git status --short

          echo "Changed files count:"
          git diff --name-only | wc -l

      - name: Commit and push import branch (if changes)
        id: commit_push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No publication changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SOURCE_RUN_ID="${{ steps.source_run.outputs.run_id }}"
          IMPORT_BRANCH="bot/import-publications-${SOURCE_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "${IMPORT_BRANCH}"
          git add content/en/publication
          git commit -m "chore(publications): import from ${{ inputs.source_repo }} run ${SOURCE_RUN_ID}"
          git push origin "${IMPORT_BRANCH}"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "import_branch=${IMPORT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMPORT_BRANCH}"

      - name: Open PR to master
        if: steps.commit_push.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SOURCE_RUN_ID="${{ steps.source_run.outputs.run_id }}"
          IMPORT_BRANCH="${{ steps.commit_push.outputs.import_branch }}"

          NEW_COUNT="$(find content/en/publication -mindepth 2 -maxdepth 2 -name index.md | wc -l | tr -d ' ')"

          PR_TITLE="chore(publications): import from ${{ inputs.source_repo }} run ${SOURCE_RUN_ID}"

          PR_BODY_FILE="$(mktemp)"
          {
            echo "Automated publication import from \`${{ inputs.source_repo }}\`."
            echo
            echo "- Source branch input: \`${{ inputs.source_branch }}\`"
            echo "- Source ref input: \`${{ inputs.source_ref }}\`"
            echo "- Source workflow run ID: \`${SOURCE_RUN_ID}\`"
            echo "- Imported publication count (index.md files): \`${NEW_COUNT}\`"
            echo
            echo "This PR was generated by \`.github/workflows/import-publication-artifact.yml\`."
            echo
            echo "_No auto-merge is enabled; manual review required._"
          } > "${PR_BODY_FILE}"

          if gh pr list --head "${IMPORT_BRANCH}" --base master --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base master \
              --head "${IMPORT_BRANCH}" \
              --title "${PR_TITLE}" \
              --body-file "${PR_BODY_FILE}"
            echo "PR created."
          else
            echo "PR already exists for ${IMPORT_BRANCH}; skipping create."
          fi