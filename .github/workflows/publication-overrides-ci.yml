name: Publication overrides validation

on:
  pull_request:
    paths:
      - "assets/**"
      - "config/**"
      - "content/**"
      - "data/publication_overrides.yml"
      - "go.mod"
      - "go.sum"
      - "layouts/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/apply_publication_overrides.py"
      - "static/**"
      - "tests/**"
      - "cv-builder/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  overrides-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Vendor Hugo modules
        run: hugo mod vendor

      - name: Run Hugo build
        run: hugo --gc --minify

      - name: Verify built site outputs
        run: |
          test -s public/files/cv.pdf
          test -s public/publication/index.html

      - name: Validate overrides (check mode)
        run: uv run python scripts/apply_publication_overrides.py --check

      - name: Apply overrides
        run: uv run python scripts/apply_publication_overrides.py

      - name: Re-run check (idempotence assertion)
        run: uv run python scripts/apply_publication_overrides.py --check

      - name: Assert working tree clean after apply+check
        run: |
          git diff --exit-code
          git status --short

      - name: Run website and CV tests
        run: uv run pytest -q