name: Publication overrides validation

on:
  pull_request:
    paths:
      - "data/publication_overrides.yml"
      - "scripts/apply_publication_overrides.py"
      - "tests/test_apply_publication_overrides.py"
      - "content/en/publication/**"
      - ".github/workflows/publication-overrides-ci.yml"
  workflow_dispatch:

jobs:
  overrides-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Run Hugo build
        run: hugo --gc --minify

      - name: Validate overrides (check mode)
        run: uv run python scripts/apply_publication_overrides.py --check

      - name: Apply overrides
        run: uv run python scripts/apply_publication_overrides.py

      - name: Re-run check (idempotence assertion)
        run: uv run python scripts/apply_publication_overrides.py --check

      - name: Assert working tree clean after apply+check
        run: |
          git diff --exit-code
          git status --short

      - name: Run override tests
        run: uv run pytest -q