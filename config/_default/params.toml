# HugoBlox site configuration
# Documentation: https://docs.hugoblox.com/

[hugoblox]
  schema = "2.0"

  [hugoblox.identity]
    name = "Scott Love"
    organization = ""
    type = "person"
    tagline = ""
    description = ""
    [hugoblox.identity.social]
      twitter = "love_a_scott"

  [hugoblox.theme]
    mode = "dark"
    pack = "default"
  
  [hugoblox.theme.colors_dark]
    primary = "#f76497"

  [hugoblox.typography]
    pack = "modern"

  [hugoblox.layout]
    radius = "md"
    spacing = "spacious"
    avatar_shape = "circle"

  [hugoblox.header]
    enable = true
    style = "navbar"
    sticky = true
    align = "left"
    search = true
    theme_toggle = true
    theme_picker = false
    language_switcher = true
    [hugoblox.header.cta]
      enable = false
      text = ""
      url = ""

  [hugoblox.footer]
    style = "minimal"
    language_switcher = true
    text = ""

  [hugoblox.copyright]
    notice = "© {year} Scott Love"

  [hugoblox.content.math]
    enable = false

  [hugoblox.content.toc]
    enable = true

  [hugoblox.content.reading_time]
    enable = true

  [hugoblox.content.citations]
    style = "apa"

  [hugoblox.search]
    enable = true
    suggestions = []
    quick_actions = []

  [hugoblox.comments]
    enable = false
    provider = ""
    [hugoblox.comments.disqus]
      shortname = ""

  [hugoblox.analytics.google]
    measurement_id = "G-TSDCCS0DQG"

  [hugoblox.repository]
    enable = false
    url = ""
    branch = "main"
    content_dir = "content"

  [hugoblox.locale]
    date_format = "Jan 2, 2006"
    time_format = "3:04 PM"
    address_format = "en-us"

  [hugoblox.privacy]
    enable = false
    anonymize_analytics = true
