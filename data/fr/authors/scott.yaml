role: Chargé de Recherche

bio: |
  Je suis chercheur en neurosciences cognitives utilisant actuellement des techniques de neuroimagerie chez des animaux de ferme pour étudier : 1) l'influence de l'environnement précoce sur le développement comportemental et neurobiologique et 2) la perception sociale et ses mécanismes neuronaux sous-jacents.

  Depuis novembre 2017, je suis Chargé de Recherche à l'Unité Mixte de Recherche [PRC](https://www6.val-de-loire.inrae.fr/physiologie_reproduction_comportements) (Physiologie de la Reproduction et des Comportements) à [Nouzilly](https://www.google.com/maps/place/Inra+Centre+Val+DeLoire/@47.544757,0.782861,15z/data=!4m5!3m4!1s0x0:0xe0400dff4907150e!8m2!3d47.544757!4d0.782861), France.

  Consultez également le [réseau Cognition Animale et Bien-être en Élevage](https://recabee.netlify.app/fr/) que je contribue à animer.

interests:
  - Cerveau
  - Neuroscience Comparative
  - Développement
  - Perception Sociale
  - IRM
  - EEG
