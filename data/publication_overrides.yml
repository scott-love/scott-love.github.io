# Website-owned editorial override data for generated publication bundles.
#
# Purpose
# -------
# `content/en/publication/hal-*/index.md` bundles are generated/regenerated
# from canonical data in `scott-love/academic-cv`. Regeneration overwrites
# those files, so website-only editorial choices (featured flags, tags,
# abstracts, images, extra links) must live here instead of being hand-edited
# directly in the generated bundles. Apply this file with
# `scripts/apply_publication_overrides.py` after every regeneration:
#
#   academic-cv generated fields
#           |
#           v
#   website editorial overrides (this file)
#           |
#           v
#   final Hugo content (content/en/publication/hal-*/index.md)
#
# Schema
# ------
# Top-level keys are HAL identifiers (e.g. `hal-01464145`), matching the
# `hugoblox.ids.hal` value and the bundle directory name of an active
# publication under `content/en/publication/`. Each entry may define any of
# the following website-owned fields (the complete editorial allowlist):
#
#   featured: bool
#     Marks the publication as featured. An explicit `false` is preserved so
#     a stale `true` from a previous run is cleared rather than left as-is.
#
#   tags: list[str]
#     Free-form topical tags shown on the website.
#
#   abstract: str
#     Website-displayed abstract/summary text.
#
#   image: object
#     HugoBlox-compatible image reference.
#       filename: str       - image file name within the bundle directory
#                              (e.g. `featured.png`, must exist alongside
#                              `index.md`).
#       preview_only: bool  - optional; when true, HugoBlox only uses the
#                              image as a list/preview thumbnail.
#
#   links: list[object]
#     Additional editorial links (e.g. PDFs). Each item has:
#       type: str  - link type, e.g. `pdf`, `code`, `slides`.
#       url: str   - link target.
#     Canonical HAL links generated by academic-cv (`type: url`) are always
#     preserved. Editorial links are appended, and an editorial link with the
#     same `(type, url)` pair as an existing link is not duplicated.
#
# Only the fields above are applied. Canonical fields (title, authors, date,
# publication_types, publication, hugoblox.ids.*, canonical HAL links, etc.)
# are never touched by the override script.
#
# Unknown HAL IDs (keys with no matching active bundle under
# `content/en/publication/hal-*/`) and malformed entries (wrong types, unknown
# fields) are treated as validation errors by
# `scripts/apply_publication_overrides.py`, so stale or typo'd overrides fail
# fast instead of silently accumulating.
#
# The entries below were recovered from the pre-migration archived bundles in
# `content/en/publication_archive_pre_hal_migration/` by matching DOIs to the
# regenerated `hal-*` bundles. No abstracts, images, or links were invented;
# publications without a confidently matched archived record are simply
# absent from this file.

hal-01464145:
  featured: false
  tags:
  - brain
  - anatomy
  - baboon
  - template
  - segmentation
  abstract: 'The baboon (Papio) brain is a remarkable model for investigating the brain. The current work aimed at creating a population-average baboon (Papio anubis) brain template and its left/right hemisphere symmetric version from a large sample of T1-weighted magnetic resonance images collected from 89 individuals. Averaging the prior probability maps output during the segmentation of each individual also produced the first baboon brain tissue probability maps for grey matter, white matter and cerebrospinal fluid. The templates and the tissue probability maps were created using state-of-the-art, freely available software tools and are being made freely and publicly available: http://www.nitrc.org/projects/haiko89/. It is hoped that these images will aid neuroimaging research of the baboon by, for example, providing a modern, high quality normalization target and accompanying standardized coordinate system as well as probabilistic priors that can be used during tissue segmentation.'
  image:
    filename: featured.png
    preview_only: true
  links:
  - type: pdf
    url: https://hal-amu.archives-ouvertes.fr/hal-01464145/document
hal-01827945:
  featured: false
  tags:
  - anatomy
  - brain
  - mri
  - cortex
  abstract: 'The precise sulcogyral localization of cortical lesions is mandatory to improve communication between practitioners and to predict and prevent post-operative deficits. This process, which assumes a good knowledge of the cortex anatomy and a systematic analysis of images, is, nevertheless, sometimes neglected in the neurological and neurosurgical training. This didactic paper proposes a brief overview of the sulcogyral anatomy, using conventional MR-slices, and also reconstructions of the cortical surface after a more or less extended inflation process. This method simplifies the cortical anatomy by removing part of the cortical complexity induced by the folding process, and makes it more understandable. We then reviewed several methods for localizing cortical structures, and proposed a three-step identification: after localizing the lateral, medial or ventro-basal aspect of the hemisphere (step 1), the main interlobar sulci were located to limit the lobes (step 2). Finally,
    intralobar sulci and gyri were identified (step 3) thanks to the same set of rules. This paper does not propose any new identification method but should be regarded as a set of practical guidelines, useful in daily clinical practice, for detecting the main sulci and gyri of the human cortex.'
  image:
    filename: featured.png
    preview_only: true
hal-01827953:
  featured: false
  tags:
  - gaze
  - eeg
  - face
  - social
  abstract: 'Gaze direction, a cue of both social and spatial attention, is known to modulate early neural responses to faces e.g. N170. However, findings in the literature have been inconsistent, likely reflecting differences in stimulus characteristics and task requirements. Here, we investigated the effect of task on neural responses to dynamic gaze changes: away and toward transitions (resulting or not in eye contact). Subjects performed, in random order, social (away/toward them) and non-social (left/right) judgment tasks on these stimuli. Overall, in the non-social task, results showed a larger N170 to gaze aversion than gaze motion toward the observer. In the social task, however, this difference was no longer present in the right hemisphere, likely reflecting an enhanced N170 to gaze motion toward the observer. Our behavioral and event-related potential data indicate that performing social judgments enhances saliency of gaze motion toward the observer, even those that did not result
    in gaze contact. These data and that of previous studies suggest two modes of processing visual information: a ''default mode'' that may focus on spatial information; a ''socially aware mode'' that might be activated when subjects are required to make social judgments. The exact mechanism that allows switching from one mode to the other remains to be clarified.'
  image:
    filename: featured.png
    preview_only: true
  links:
  - type: pdf
    url: https://www.researchgate.net/publication/275668197_Social_decisions_affect_neural_activity_to_perceived_dynamic_gaze/download
hal-01829230:
  featured: false
  tags:
  - audiovisual
  - multisensory
  - synchrony
  abstract: Synchrony judgments involve deciding whether cues to an event are in synch or out of synch, while temporal order judgments involve deciding which of the cues came first. When the cues come from different sensory modalities these judgments can be used to investigate multisensory integration in the temporal domain. However, evidence indicates that that these two tasks should not be used interchangeably as it is unlikely that they measure the same perceptual mechanism. The current experiment further explores this issue across a variety of different audiovisual stimulus types. Participants were presented with 5 audiovisual stimulus types, each at 11 parametrically manipulated levels of cue asynchrony. During separate blocks, participants had to make synchrony judgments or temporal order judgments. For some stimulus types many participants were unable to successfully make temporal order judgments, but they were able to make synchrony judgments. The mean points of subjective simultaneity
    for synchrony judgments were all video-leading, while those for temporal order judgments were all audio-leading. In the within participants analyses no correlation was found across the two tasks for either the point of subjective simultaneity or the temporal integration window. Stimulus type influenced how the two tasks differed; nevertheless, consistent differences were found between the two tasks regardless of stimulus type. Therefore, in line with previous work, we conclude that synchrony and temporal order judgments are supported by different perceptual mechanisms and should not be interpreted as being representative of the same perceptual process.
  links:
  - type: pdf
    url: https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0054798&type=printable
hal-01829234:
  featured: false
  tags:
  - biological motion
  - fmri
  abstract: It has been proposed that we make sense of the movements of others by observing fluctuations in the kinematic properties of their actions. At the neural level, activity in the human motion complex (hMT+) and posterior superior temporal sulcus (pSTS) has been implicated in this relationship. However, previous neuroimaging studies have largely utilized brief, diminished stimuli, and the role of relevant kinematic parameters for the processing of human action remains unclear. We addressed this issue by showing extended-duration natural displays of an actor engaged in two common activities, to 12 participants in an fMRI study under passive viewing conditions. Our region-of-interest analysis focused on three neural areas (hMT+, pSTS, and fusiform face area) and was accompanied by a whole-brain analysis. The kinematic properties of the actor, particularly the speed of body part motion and the distance between body parts, were related to activity in hMT+ and pSTS. Whole-brain exploratory
    analyses revealed additional areas in posterior cortex, frontal cortex, and the cerebellum whose activity was related to these features. These results indicate that the kinematic properties of peoples' movements are continually monitored during everyday activity as a step to determining actions and intent.
  links:
  - type: pdf
    url: https://www.researchgate.net/profile/Phil_McAleer/publication/255953019_The_role_of_kinematics_in_cortical_regions_for_continuous_human_motion_perception/links/0c96052174278248e0000000/The-role-of-kinematics-in-cortical-regions-for-continuous-human-motion-perception.pdf
hal-01830320:
  featured: false
  tags:
  - synchrony
  - fmri
  - music
  - multisensory
  - audiovisual
  abstract: When we observe someone perform a familiar action, we can usually predict what kind of sound that action will produce. Musical actions are over-experienced by musicians and not by non-musicians, and thus offer a unique way to examine how action expertise affects brain processes when the predictability of the produced sound is manipulated. We used functional magnetic resonance imaging to scan 11 drummers and 11 age- and gender-matched novices who made judgments on point-light drumming movements presented with sound. In Experiment 1, sound was synchronized or desynchronized with drumming strikes, while in Experiment 2 sound was always synchronized, but the natural covariation between sound intensity and velocity of the drumming strike was maintained or eliminated. Prior to MRI scanning, each participant completed psychophysical testing to identify personal levels of synchronous and asynchronous timing to be used in the two fMRI activation tasks. In both experiments, the drummers'
    brain activation was reduced in motor and action representation brain regions when sound matched the observed movements, and was similar to that of novices when sound was mismatched. This reduction in neural activity occurred bilaterally in the cerebellum and left parahippocampal gyrus in Experiment 1, and in the right inferior parietal lobule, inferior temporal gyrus, middle frontal gyrus and precentral gyrus in Experiment 2. Our results indicate that brain functions in action-sound representation areas are modulated by multimodal action expertise.
hal-01832283:
  featured: false
  tags:
  - fmri
  - audiovisual
  - multisensory
  abstract: Multisensory processing is a core perceptual capability, and the need to understand its neural bases provides a fundamental problem in the study of brain function. Both synchrony and temporal order judgments are commonly used to investigate synchrony perception between different sensory cues and multisensory perception in general. However, extensive behavioral evidence indicates that these tasks do not measure identical perceptual processes. Here we used functional magnetic resonance imaging to investigate how behavioral differences between the tasks are instantiated as neural differences. As these neural differences could manifest at either the sustained (task/state-related) and/or transient (event-related) levels of processing, a mixed block/event-related design was used to investigate the neural response of both time-scales. Clear differences in both sustained and transient BOLD responses were observed between the two tasks, consistent with behavioral differences indeed arising
    from overlapping but divergent neural mechanisms. Temporalorder judgments, butnot synchrony judgments, required transient activation in several left hemisphere regions, which may reflect increased task demands caused by an extra stage of processing. Our results highlight that multisensory integrationmechanisms can be task dependent, which, in particular, has implications for the study of atypical temporal processing in clinical populations.
  links:
  - type: pdf
    url: https://www.frontiersin.org/articles/10.3389/fnhum.2018.00274/pdf
hal-02437641:
  featured: false
  tags:
  - neophobia
  - emotion
  abstract: Avoidance of novelty, termed neophobia, protects animals from potential dangers but can also impair their adaptation to novel environments or food resources. This behaviour is particularly well described in birds but the neurobiological correlates remain unexplored. Here, we measured neuronal activity in the amygdala and the striatum, two brain regions believed to be involved in novelty detection, by labelling the early gene c-fos following chicks exposure to a novel food (NF), a novel object (NO) or a familiar food (FF). NF and NO chicks showed significantly longer latencies to touch the food, less time eating and emitted more fear-vocalizations than control chicks. Latency to touch the food was also longer for NO than for NF chicks. Significantly higher densities of c-fos positive cells were present in all the nuclei of the arcopallium/amygdala of NF and NO chicks compared to FF chicks. Also, NO chicks showed higher positive cell densities than NF chicks in the posterior amygdaloid,
    the intermediate and the medial arcopallium. Exposure to novel food or object induced a similar increase in c-fos expression in the nucleus accumbens and the medial striatum. Our data provide evidence activation of the arcopallium/amygdala is specific of the type of novelty. The activation of striatum may be more related to novelty seeking.
hal-02622444:
  featured: false
  tags:
  - voice
  - identity
  - experience
  abstract: The ability to recognize an individual from their voice is a widespread ability with a long evolutionary history. Yet, the perceptual representation of familiar voices is ill-defined. In two experiments, we explored the neuropsychological processes involved in the perception of voice identity. We specifically explored the hypothesis that familiar voices (trained-to-familiar (Experiment 1), and famous voices (Experiment 2)) are represented as a whole complex pattern, well approximated by the average of multiple utterances produced by a single speaker. In experiment 1, participants learned three voices over several sessions, and performed a three-alternative forced-choice identification task on original voice samples and several “speaker averages,” created by morphing across varying numbers of different vowels (e.g., [a] and [i]) produced by the same speaker. In experiment 2, the same participants performed the same task on voice samples produced by familiar speakers. The two experiments
    showed that for famous voices, but not for trained-to-familiar voices, identification performance increased and response times decreased as a function of the number of utterances in the averages. This study sheds light on the perceptual representation of familiar voices, and demonstrates the power of average in recognizing familiar voices. The speaker average captures the unique characteristics of a speaker, and thus retains the information essential for recognition; it acts as a prototype of the speaker.
  image:
    filename: featured.png
    preview_only: true
  links:
  - type: pdf
    url: https://www.frontiersin.org/articles/10.3389/fpsyg.2017.01180/pdf
hal-02644669:
  featured: false
  tags:
  - fmri
  - multisensory
  - face
  - voice
  - social
  - connectivity
  abstract: 'Perception of faces and voices plays a prominent role in human social interaction, making multisensory integration of cross-modal speech a topic of great interest in cognitive neuroscience. How to define potential sites of multisensory integration using functional magnetic resonance imaging (fMRI) is currently under debate, with three statistical criteria frequently used (e.g., super-additive, max and mean criteria). In the present fMRI study, 20 participants were scanned in a block design under three stimulus conditions: dynamic unimodal face, unimodal voice and bimodal face–voice. Using this single dataset, we examine all these statistical criteria in an attempt to define loci of face–voice integration. While the super-additive and mean criteria essentially revealed regions in which one of the unimodal responses was a deactivation, the max criterion appeared stringent and only highlighted the left hippocampus as a potential site of face– voice integration. Psychophysiological
    interaction analysis showed that connectivity between occipital and temporal cortices increased during bimodal compared to unimodal conditions. We concluded that, when investigating multisensory integration with fMRI, all these criteria should be used in conjunction with manipulation of stimulus signal-to-noise ratio and/or cross-modal congruency.'
  image:
    filename: featured.png
hal-02647342:
  featured: false
  tags:
  - dance
  - fmri
  - multisensory
  abstract: 'The superior temporal sulcus (STS) and gyrus (STG) are commonly identified to be functionally relevant for multisensory integration of audiovisual (AV) stimuli. However, most neuroimaging studies on AV integration used stimuli of short duration in explicit evaluative tasks. Importantly though, many of our AV experiences are of a long duration and ambiguous. It is unclear if the enhanced activity in audio, visual, and AV brain areas would also be synchronised over time across subjects when they are exposed to such multisensory stimuli. We used intersubject correlation to investigate which brain areas are synchronised across novices for uni- and multisensory versions of a 6-min 26-s recording of an unfamiliar, unedited Indian dance recording (Bharatanatyam). In Bharatanatyam, music and dance are choreographed together in a highly intermodal-dependent manner. Activity in the middle and posterior STG was significantly correlated between subjects and showed also significant enhancement
    for AV integration when the functional magnetic resonance signals were contrasted against each other using a general linear model conjunction analysis. These results extend previous studies by showing an intermediate step of synchronisation for novices: while there was a consensus across subjects'' brain activity in areas relevant for unisensory processing and AV integration of related audio and visual stimuli, we found no evidence for synchronisation of higher level cognitive processes, suggesting these were idiosyncratic.'
  image:
    filename: featured.png
    preview_only: true
  links:
  - type: pdf
    url: https://journals.sagepub.com/doi/pdf/10.1068/i0536
hal-02956337:
  featured: false
  tags:
  - synchrony
  - development
  - audiovisual
  - face
  - multisensory
  abstract: The brain's ability to integrate information from the different senses is essential for decreasing sensory uncertainty and ultimately limiting errors. Temporal correspondence is one of the key processes that determines whether information from different senses will be integrated and is influenced by both experience- and task-dependent mechanisms in adults. Here we investigated the development of both task- and experience-dependent temporal mechanisms by testing 7-8-year-old children, 10-11-year-old children, and adults in two tasks (simultaneity judgment, temporal order judgment) using audiovisual stimuli with differing degrees of association based on prior experience (low for beep-flash vs. high for face-voice). By fitting an independent channels model to the data, we found that while the experience-dependent mechanism of audiovisual simultaneity perception is already adult-like in 10-11-year-old children, the task-dependent mechanism is still not. These results indicate that
    differing maturation rates of experience-dependent and task-dependent mechanisms underlie the development of multisensory integration. Understanding this development has important implications for clinical and educational interventions.
  links:
  - type: pdf
    url: https://researchportal.bath.ac.uk/files/210524781/Petrini_et_al_2020_manuscript_R2.pdf
hal-03627385:
  featured: false
  tags:
  - quail
  - mri
  abstract: 'The structural connectivity of animal brains can be revealed using post-mortem diffusion-weighted magnetic resonance imaging (MRI). Despite the existence of several structural atlases of avian brains, few of them address the bird’s structural connectivity. In this study, a novel atlas of the structural connectivity is proposed for the male Japanese quail (Coturnix japonica), aiming at investigating two lines divergent on their emotionality trait: the short tonic immobility (STI) and the long tonic immobility (LTI) lines. The STI line presents a low emotionality trait, while the LTI line expresses a high emotionality trait. 21 male Japanese quail brains from both lines were scanned post-mortem for this study, using a preclinical Bruker 11.7 T MRI scanner. Diffusion-weighted MRI was performed using a 3D segmented echo planar imaging (EPI) pulsed gradient spin-echo (PGSE) sequence with a 200 μm isotropic resolution, 75 diffusion-encoding directions and a b-value fixed at 4500 s/mm2.
    Anatomical MRI was likewise performed using a 2D anatomical T2-weighted spin-echo (SE) sequence with a 150 μm isotropic resolution. This very first anatomical connectivity atlas of the male Japanese quail reveals 34 labeled fiber tracts and the existence of structural differences between the connectivity patterns characterizing the two lines. Thus, the link between the male Japanese quail’s connectivity and its underlying anatomical structures has reached a better understanding.'
  links:
  - type: pdf
    url: https://link.springer.com/content/pdf/10.1007/s00429-022-02457-2.pdf?pdf=button%20sticky
hal-03752401:
  featured: true
  tags:
  - sheep
  - vocalization
  abstract: If you have ever been out to the countryside in the spring, you might have heard sheep bleating to their lambs. Sheep also bleat when they are separated from the flock or stressed in some other way. To us, all these bleats sound very similar. But do you think they also sound similar to the lambs? Or do you think the lambs know whose mother is calling and what they are saying? Scientists try to interpret the bleats of sheep by observing their behavior when they hear these sounds. They study the sound waves of recorded bleats to identify each sheep’s unique voice and even determine which emotions the sheep are feeling. They also investigate the brain to find out what is going on inside the heads of sheep when they hear and understand the sounds of other sheep. Studies show that sheep really can recognize each other’s voices and communicate vocally.
  image:
    filename: featured.png
  links:
  - type: pdf
    url: https://www.frontiersin.org/articles/10.3389/frym.2022.703514/pdf
hal-03753010:
  featured: false
  tags:
  - brain
  - mri
  - baboon
  - lateralization
  - evolution
  - comparative
  abstract: The planum temporale (PT) is a critical region of the language functional network in the human brain showing a striking size asymmetry toward the left hemisphere. Historically considered as a structural landmark of the left-brain specialization for language, a similar anatomical bias has been described in great apes but never in monkeys—indicating that this brain landmark might be unique to Hominidae evolution. In the present in vivo magnetic resonance imaging study, we show clearly for the first time in a nonhominid primate species, an Old World monkey, a left size predominance of the PT among 96 olive baboons (Papio anubis), using manual delineation of this region in each individual hemisphere. This asymmetric distribution was quasi-identical to that found originally in humans. Such a finding questions the relationship between PT asymmetry and the emergence of language, indicating that the origin of this cerebral specialization could be much older than previously thought, dating
    back, not to the Hominidae, but rather to the Catarrhini evolution at the common ancestor of humans, great apes and Old World monkeys, 30–40 million years ago.
  links:
  - type: pdf
    url: https://academic.oup.com/cercor/article-pdf/28/5/1808/24658977/bhx096.pdf
hal-03761265:
  featured: false
  tags:
  - music
  - vocalization
  abstract: Music can cause pleasant sensations in humans whereas some noises can cause discomfort. The effects of music and noise have also been somewhat studied in animals, showing different impacts. In this review we aim to illustrate the differences and similarities between animals, in terms of their sensitivity to auditory stimuli (noise or music), by first recalling some generalities about the physical characteristics of sound and the biological bases of hearing. Second, based on the studies reported in this review, we conclude that ambient noise is harmful and/or stressful, and that musical sounds can take many forms with a large range of impacts in animals. Finally, we present two practical examples of the use of music with animals (one in the context of a zoo and the other in cattle breeding) and an example of an experiment designed to understand the impact of music on neonate lambs. These three examples highlight how music can help to improve animal welfare.
  image:
    filename: featured.png
    preview_only: true
  links:
  - type: pdf
    url: https://jimis.episciences.org/9971/pdf
hal-03830179:
  featured: true
  tags:
  - sheep
  - mri
  abstract: The psychoendocrine evaluation of lamb development has demonstrated that maternal deprivation and milk replacement alters health, behavior, and endocrine profiles. While lambs are able to discriminate familiar and non-familiar conspecifics (mother or lamb), only lambs reared with their mother develop such clear social discrimination or preference. Lambs reared without mother display no preference for a specific lamb from its own group. Differences in exploratory and emotional behaviors between mother-reared and mother-deprived lambs have also been reported. As these behavioural abilities are supported by the brain, we hypothesize that rearing with maternal deprivation and milk replacement leads to altered brain development and maturation. To test this hypothesis, we examined brain morphometric and microstructural variables extracted from in vivo T1-weighted and diffusion-weighted magnetic resonance images acquired longitudinally (1 week, 1.5 months, and 4.5 months of age) in
    mother-reared and mother-deprived lambs. From the morphometric variables the caudate nuclei volume was found to be smaller for mother-deprived than for mother-reared lambs. T1-weighted signal intensity and radial diffusivity were higher for mother-deprived than for mother-reared lambs in both the white and gray matters. The fractional anisotropy of the white matter was lower for mother-deprived than for mother-reared lambs. Based on these morphometric and microstructural characteristics we conclude that maternal deprivation delays and affects lamb brain growth and maturation.
  image:
    filename: featured.png
    preview_only: true
  links:
  - type: pdf
    url: https://zenodo.org/record/4714660#.Y7We8C8w06U
hal-04168459:
  featured: false
  tags:
  - emotion
  abstract: 'In mammals, human-animal bonding is recognized as a source of positive affect for companion or farm animals. Because this remains unexplored in birds, we investigated captive parrots’ perspective of the human-animal relationship. We used a classical separation-reunion paradigm and predicted that variations in parrots ’ facial displays and behaviours would indicate their appraisal of the relationship. The test was divided into three phases of two minutes each: the bird was placed in an unfamiliar environment with a familiar caregiver (union), then the bird was left alone (separation) and finally, the caregiver returned (reunion). The test was repeated 10 times for each bird and video recorded in order to analyze their behaviour. The data show significantly higher crown and nape feather heights, higher redness of the skin and higher frequency of contact-seeking behaviours during the union and reunion phases than during the separation phase during which they expressed long distance
    contact calls. We observed the expression of eye pinning during the union and reunion phases in one out of five macaws. We argue that variation in facial displays provides indicators of parrot ’s positive appraisal of the caretaker presence. Our results broaden the scope for further studies on parrots’ expression of their subjective feelings.'
  image:
    filename: featured.png
hal-04559765:
  featured: false
  tags:
  - synchrony
  - autism spectrum disorders
  - audiovisual
  - multisensory
  abstract: Research has shown that children on the autism spectrum and adults with high levels of autistic traits are less sensitive to audiovisual asynchrony compared to their neurotypical peers. However, this evidence has been limited to simultaneity judgments (SJ) which require participants to consider the timing of two cues together. Given evidence of partly divergent perceptual and neural mechanisms involved in making temporal order judgments (TOJ) and SJ, and given that SJ require a more global type of processing which may be impaired in autistic individuals, here we ask whether the observed differences in audiovisual temporal processing are task and stimulus specific. We examined the ability to detect audiovisual asynchrony in a group of 26 autistic adult males and a group of age and IQ-matched neurotypical males. Participants were presented with beep-flash, point-light drumming, and face-voice displays with varying degrees of asynchrony and asked to make SJ and TOJ. The results
    indicated that autistic participants were less able to detect audiovisual asynchrony compared to the control group, but this effect was specific to SJ and more complex social stimuli (e.g., face-voice) with stronger semantic correspondence between the cues, requiring a more global type of processing. This indicates that audiovisual temporal processing is not generally different in autistic individuals and that a similar level of performance could be achieved by using a more local type of processing, thus informing multisensory integration theory as well as multisensory training aimed to aid perceptual abilities in this population.
  image:
    filename: featured.png
    preview_only: true
  links:
  - type: pdf
    url: https://onlinelibrary.wiley.com/doi/epdf/10.1002/aur.3134
hal-04574339:
  featured: false
  tags:
  - emotion
  abstract: Non-invasive markers of affective states can help understanding animals' perception of situations and improving their welfare. These markers are scarce in avian species. In this study, we investigate the potential relation between alterations in facial skin redness in hens and their corresponding affective states. Six hens were filmed in both naturally unfolding scenarios and controlled tests designed to elicit various affective states. The facial skin redness was measured from images extracted from the videos. Our observations revealed that hens exhibited the highest degree of facial skin redness in negative situations of high arousal, a high redness in positive situations of high arousal, and the lowest in positive situations of low arousal. In a second study, we further examined whether facial skin redness and secretory immunoglobulin A (S-IgA) can serve as markers for the quality of the human-animal relationship. Two groups of hens, one habituated to humans (n=13) and one
    non-habituated (n=12), were compared for general fearfulness in an open field test and for fear of humans in a reactivity to human test. In the open-field test, there were no statistical differences in general fearfulness, facial skin redness or S-IgA concentrations between both groups. However, habituated hens exhibited significantly lower fearfulness and facial skin redness in the presence of humans compared to non-habituated hens in the reactivity to human test. Additionally, habituated hens showed significant lower S-IgA concentration in lachrymal fluid in the presence of humans, with no significant differences in saliva or cloacal samples. We propose that changes in facial skin redness reflect variations in affective states and can be used as a marker for assessing the quality of the human-hen relationship. The relationship between S-IgA concentrations and affective states requires further investigation.
  image:
    filename: featured.png
    preview_only: true
  links:
  - type: pdf
    url: https://www.sciencedirect.com/science/article/pii/S0168159124001163/pdfft?md5=bb89bcaef3dff4a44803b3162758f619&pid=1-s2.0-S0168159124001163-main.pdf
hal-04626332:
  featured: true
  tags:
  - sheep
  - mri
  abstract: Magnetic resonance imaging (MRI) is a non-invasive technique that requires the participant to be completely motionless. To date, MRI in awake and unrestrained animals has only been achieved with humans and dogs. For other species, alternative techniques such as anesthesia, restraint and/or sedation have been necessary. Anatomical and functional MRI studies with sheep have only been conducted under general anesthesia. This ensures the absence of movement and allows relatively long MRI experiments but it removes the non-invasive nature of the MRI technique (i.e., IV injections, intubation). Anesthesia can also be detrimental to health, disrupt neurovascular coupling, and does not permit the study of higher-level cognition. Here, we present a proof-of-concept that sheep can be trained to perform a series of tasks, enabling them to voluntarily participate in MRI sessions without anesthesia or restraint. We describe a step-by-step training protocol based on positive reinforcement
    (food and praise) that could be used as a basis for future neuroimaging research in sheep. This protocol details the two successive phases required for sheep to successfully achieve MRI acquisitions of their brain. By providing structural brain MRI images from six out of ten sheep, we demonstrate the feasibility of our training protocol. This innovative training protocol paves the way for the possibility of conducting animal welfare-friendly functional MRI studies with sheep to investigate ovine cognition.
