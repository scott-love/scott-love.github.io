[project]
name = "scott-love-site-tools"
version = "0.1.0"
description = "Publication and CV tools for the Scott Love website"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.28.0",
]

[dependency-groups]
dev = [
    "black>=22.0.0",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.0.250",
]

[tool.pytest.ini_options]
testpaths = ["tests", "cv-builder/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W"]
ignore = ["E501"]
